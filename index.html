<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>云来客栈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: a lacquered wooden game cabinet — plaque HUD on top, 16:10 stage canvas, wooden button rail below; panels unroll as paper scrolls */
:root{
  --page:#1d130c;
  --page-2:#2e1d11;
  --ink:#2b1a10;
  --ink-soft:#6a4a30;
  --paper:#f8ecd0;
  --paper-2:#efdcb1;
  --paper-edge:#c9a46a;
  --wood:#8a5229;
  --wood-dark:#55311a;
  --wood-light:#c4864c;
  --cinnabar:#c0392b;
  --cinnabar-dark:#86200f;
  --gold:#f3c34f;
  --gold-dark:#a8771c;
  --jade:#3d8b5c;
  --jade-dark:#2a6642;
  --dim:rgba(18,9,3,.66);
  --hud-text:#fff3d6;
  --f-display:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC","Noto Serif SC",serif;
  --f-ui:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-num:"ZCOOL KuaiLe",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;box-sizing:border-box;
  background:var(--page);
  background-image:radial-gradient(ellipse 80% 60% at 50% 0%,#3d2615 0%,rgba(29,19,12,0) 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,rgba(0,0,0,0) 2px 7px);
  color:var(--paper);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 20px;
  -webkit-tap-highlight-color:transparent;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

/* ---------- HUD ---------- */
#hud{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
  padding:7px 10px;border-radius:12px;
  background:linear-gradient(180deg,var(--wood-light) 0%,var(--wood) 55%,#7a4622 100%);
  border:3px solid var(--wood-dark);
  box-shadow:inset 0 2px 0 rgba(255,230,180,.35),0 3px 0 #120a05;
  color:var(--hud-text);text-shadow:0 1px 0 var(--wood-dark),0 0 3px rgba(60,30,10,.6);
}
.hc{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:rgba(50,25,10,.38);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);min-height:34px;font-variant-numeric:tabular-nums}
.hc img{width:22px;height:22px;display:block}
.hc b{font-family:var(--f-num);font-size:19px;font-weight:400;color:#fff7e2}
.hc small{opacity:.8;font-size:13px}
#h-day{flex-direction:column;align-items:flex-start;gap:0;line-height:1.05;padding:3px 12px;border-radius:10px}
#h-dayn{font-family:var(--f-display);font-size:20px;color:var(--gold)}
#h-time{font-size:13px;opacity:.95}
#h-stars{color:var(--gold);letter-spacing:1px;font-size:15px}
.fbar{width:74px;height:8px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.fbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8603c,var(--gold));transition:width .4s}
#h-en{display:flex;gap:3px}
#h-en i{width:11px;height:11px;border-radius:50%;background:rgba(0,0,0,.35);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
#h-en i.on{background:radial-gradient(circle at 35% 35%,#fff3b0,#f3a93a 60%,#c4661a);box-shadow:0 0 4px rgba(255,190,80,.8)}
.hud-spacer{flex:1 1 0}
.seg{display:flex;gap:3px}
.hbtn{min-width:34px;height:32px;padding:0 8px;border-radius:8px;border:2px solid var(--wood-dark);background:linear-gradient(#f6e2b3,#dfbd7c);color:var(--ink);font-size:14px;cursor:pointer;box-shadow:0 2px 0 var(--wood-dark);text-shadow:none;line-height:1}
.hbtn:active{transform:translateY(2px);box-shadow:none}
.hbtn.on{background:linear-gradient(#ffd56b,#e8a53a);border-color:#7a4a12}
.hbtn.off{opacity:.7;text-decoration:line-through;text-decoration-thickness:2px}

#goalbar{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:center;font-size:14px;color:#f3dfb4;padding:0 6px;min-height:20px}
#goalbar .g-tag{color:var(--gold)}
#goalbar .g-done{color:#9fe0a8}

/* ---------- Stage ---------- */
#stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:4px solid var(--wood-dark);box-shadow:0 0 0 2px #a8703c,0 6px 0 2px #120a05,0 14px 34px rgba(0,0,0,.55);background:#2a1a10;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%}

#title-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6%;gap:10px;pointer-events:none}
#title-ui .tbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;pointer-events:auto}
#title-ui .tnote{font-size:12px;color:#fbe8c0;opacity:.85;text-shadow:0 1px 2px #000;pointer-events:none;text-align:center;padding:0 10px}

/* ---------- Buttons ---------- */
.btn{
  font-family:var(--f-ui);font-size:18px;color:var(--ink);
  background:linear-gradient(180deg,#fbeec9 0%,#ecca8a 100%);
  border:3px solid var(--wood-dark);border-radius:12px;
  box-shadow:0 4px 0 var(--wood-dark),inset 0 2px 0 rgba(255,255,255,.6);
  padding:7px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.1;white-space:nowrap;
  transition:transform .06s,filter .15s;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}
.btn:disabled{filter:grayscale(.7) brightness(.9);opacity:.6;cursor:not-allowed;transform:none}
.btn img{width:24px;height:24px}
.btn.red{background:linear-gradient(180deg,#e2563f 0%,var(--cinnabar) 55%,#a12b1c 100%);color:#fff2c6;border-color:#5e150b;box-shadow:0 4px 0 #5e150b,inset 0 2px 0 rgba(255,200,170,.45);text-shadow:0 1px 0 #6a160b}
.btn.green{background:linear-gradient(180deg,#68b886 0%,var(--jade) 100%);color:#f2fff4;border-color:#1f4a30;box-shadow:0 4px 0 #1f4a30,inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 1px 0 #1f4a30}
.btn.small{font-size:14px;padding:4px 10px;border-width:2px;border-radius:9px;box-shadow:0 3px 0 var(--wood-dark)}
.btn.small.red{box-shadow:0 3px 0 #5e150b}
.btn.small.green{box-shadow:0 3px 0 #1f4a30}
.btn.big{font-size:22px;padding:9px 22px}
.btn .cost{font-family:var(--f-num);font-size:.85em;opacity:.9}

/* ---------- Rail ---------- */
#rail{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
#rail .rl{display:flex;flex-wrap:wrap;gap:8px}
#rail .btn{position:relative}
#rail .dot{position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--cinnabar);border:2px solid #fff1cf;display:none}
#rail .dot.on{display:block}
#b-open{min-width:170px;justify-content:center}

/* ---------- Dialog ---------- */
#dlg{position:absolute;left:2%;right:2%;bottom:3%;display:flex;gap:12px;align-items:stretch;cursor:pointer;z-index:5}
#dlg .portrait{flex:0 0 auto;width:clamp(78px,14%,150px);aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 50% 40%,#fff6dd,#e8c98c);border:3px solid var(--wood-dark);box-shadow:0 3px 0 var(--wood-dark);overflow:hidden;align-self:flex-end}
#dlg .portrait canvas{width:100%;height:100%;display:block}
#dlg .portrait.none{display:none}
#dlg .box{flex:1 1 auto;min-width:0;position:relative;background:linear-gradient(180deg,rgba(252,243,220,.97),rgba(240,221,178,.97));color:var(--ink);border:3px solid var(--wood-dark);border-radius:14px;padding:14px 18px 14px;box-shadow:0 4px 0 var(--wood-dark),inset 0 0 0 2px rgba(255,255,255,.5);min-height:96px}
#dlg .name{position:absolute;top:-17px;left:14px;background:var(--cinnabar);color:#fff3cf;font-family:var(--f-display);font-size:20px;padding:1px 14px 2px;border-radius:8px;border:2px solid #5e150b;line-height:1.25}
#dlg .name:empty{display:none}
#dlg .text{font-size:clamp(14px,1.75vw,19px);line-height:1.6;white-space:pre-wrap;margin-top:4px}
#dlg .more{position:absolute;right:12px;bottom:6px;color:var(--cinnabar);font-size:14px;animation:bob 1s infinite}
#dlg .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

/* ---------- Modal scroll ---------- */
#modal{position:fixed;inset:0;z-index:50;background:var(--dim);display:flex;align-items:center;justify-content:center;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.scroll{position:relative;width:min(820px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),repeating-linear-gradient(0deg,rgba(150,110,60,.035) 0 1px,rgba(0,0,0,0) 1px 4px);
  border-left:3px solid var(--paper-edge);border-right:3px solid var(--paper-edge);box-shadow:0 18px 40px rgba(0,0,0,.6);margin:16px 0;animation:unroll .22s ease-out}
.scroll::before,.scroll::after{content:"";position:absolute;left:-14px;right:-14px;height:16px;border-radius:8px;background:linear-gradient(180deg,#7a4522,#4a2611 60%,#331a0a);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.scroll::before{top:-12px}
.scroll::after{bottom:-12px}
@keyframes unroll{from{transform:scaleY(.6);opacity:0}to{transform:none;opacity:1}}
.scroll-head{display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
.scroll-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--cinnabar-dark);flex:1;letter-spacing:2px}
.xbtn{width:38px;height:38px;border-radius:8px;border:2px solid #5e150b;background:var(--cinnabar);color:#fff1cf;font-size:22px;cursor:pointer;line-height:1;box-shadow:0 3px 0 #5e150b}
.xbtn:active{transform:translateY(2px);box-shadow:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 8px;border-bottom:2px dashed rgba(120,80,40,.3)}
.tab{font-family:var(--f-ui);font-size:16px;padding:5px 14px;border-radius:9px 9px 0 0;border:2px solid var(--paper-edge);border-bottom:none;background:var(--paper-2);color:var(--ink-soft);cursor:pointer}
.tab.on{background:#fffaf0;color:var(--cinnabar-dark);border-color:var(--wood-light)}
.scroll-body{overflow:auto;padding:12px 18px 18px;flex:1 1 auto;min-height:0;scrollbar-color:var(--wood-light) var(--paper-2)}
.hint{font-size:13px;color:var(--ink-soft);margin:0 0 10px;line-height:1.5}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:#fffaf0;border:2px solid var(--paper-edge);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.card.on{border-color:var(--jade);box-shadow:0 0 0 2px rgba(61,139,92,.25)}
.card.lock{background:#efe3c8;color:#8a7458}
.card .row{display:flex;align-items:center;gap:8px;min-width:0}
.card .ico{width:44px;height:44px;flex:0 0 auto;border-radius:10px;background:#f3e2bc;display:flex;align-items:center;justify-content:center}
.card .ico img{width:40px;height:40px}
.card h4{margin:0;font-size:17px;font-weight:400;color:var(--ink)}
.card .sub{font-size:12px;color:var(--ink-soft);line-height:1.45}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.card .meta b{color:var(--ink);font-weight:400}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;color:#fff;line-height:1.5}
.stamp{position:absolute;top:8px;right:8px;font-family:var(--f-display);color:var(--cinnabar);border:2px solid var(--cinnabar);border-radius:6px;padding:0 6px;font-size:15px;transform:rotate(8deg);opacity:.85}
.stars-s{color:var(--gold-dark);letter-spacing:1px;font-size:13px}
.statbar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.statbar span:first-child{width:30px;flex:0 0 auto}
.statbar .sb{flex:1;height:7px;border-radius:4px;background:#ead6ad;overflow:hidden}
.statbar .sb i{display:block;height:100%;background:linear-gradient(90deg,#d9842e,#f0b84a)}
.statbar em{font-style:normal;width:26px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.hearts{color:#d6455a;letter-spacing:1px;font-size:14px}
.portrait-s{width:64px;height:64px;flex:0 0 auto;border-radius:12px;background:radial-gradient(circle at 50% 40%,#fff6dd,#e8c98c);border:2px solid var(--paper-edge);overflow:hidden}
.portrait-s canvas{width:100%;height:100%;display:block}
.sect{font-family:var(--f-display);font-size:22px;color:var(--wood-dark);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.sect:first-child{margin-top:0}
.sect small{font-family:var(--f-ui);font-size:13px;color:var(--ink-soft)}

/* list rows */
.qlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.qlist li{display:flex;gap:10px;align-items:center;background:#fffaf0;border:2px solid var(--paper-edge);border-radius:10px;padding:8px 12px;min-width:0}
.qlist li.done{opacity:.6}
.qlist li.cur{border-color:var(--cinnabar);box-shadow:0 0 0 2px rgba(192,57,43,.15)}
.qlist .qn{font-size:16px;flex:0 0 auto}
.qlist .qd{font-size:13px;color:var(--ink-soft);flex:1;min-width:0}
.qlist .qr{font-size:13px;color:var(--gold-dark);flex:0 0 auto}
.qcheck{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper-edge);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.done .qcheck{background:var(--jade);border-color:var(--jade-dark)}
.cur .qcheck{border-color:var(--cinnabar)}

/* ledger */
.ledger{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.ledger td{padding:5px 4px;border-bottom:1px dashed rgba(120,80,40,.25)}
.ledger td:last-child{text-align:right;font-family:var(--f-num)}
.ledger tr.tot td{border-bottom:none;border-top:2px solid var(--wood-dark);font-size:18px;padding-top:8px}
.pos{color:var(--jade-dark)}
.neg{color:var(--cinnabar)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.statgrid div{background:#fffaf0;border:2px solid var(--paper-edge);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink-soft)}
.statgrid b{display:block;font-family:var(--f-num);font-weight:400;font-size:20px;color:var(--ink)}
.chartbox{background:#fffaf0;border:2px solid var(--paper-edge);border-radius:10px;padding:8px;overflow-x:auto}
.chartbox canvas{display:block;width:100%;min-width:300px;height:150px}
.loglist{list-style:none;margin:0;padding:0;font-size:13px;line-height:1.6;color:var(--ink-soft)}
.loglist li{border-bottom:1px dashed rgba(120,80,40,.2);padding:3px 0}
.loglist b{color:var(--cinnabar-dark);font-weight:400;margin-right:6px}

/* summary */
.summary{display:flex;flex-direction:column;gap:10px}
.sum-stamp{align-self:center;font-family:var(--f-display);font-size:34px;color:var(--cinnabar);border:3px solid var(--cinnabar);border-radius:10px;padding:0 14px;transform:rotate(-6deg);margin:4px 0 2px}
.sum-note{font-size:14px;color:var(--ink-soft);text-align:center;line-height:1.6}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:6px}
.row-center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:6px}

/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:15px;color:var(--ink-soft)}
.field input[type=text]{font-family:var(--f-ui);font-size:20px;padding:8px 12px;border-radius:10px;border:2px solid var(--paper-edge);background:#fffaf0;color:var(--ink);width:min(320px,100%)}
.looks{display:flex;gap:10px;flex-wrap:wrap}
.lookopt{width:110px;border-radius:12px;border:3px solid var(--paper-edge);background:#fffaf0;cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:14px;color:var(--ink)}
.lookopt.on{border-color:var(--cinnabar);box-shadow:0 0 0 3px rgba(192,57,43,.2)}
.lookopt canvas{width:96px;height:96px}
.help p{margin:0 0 10px;line-height:1.7;font-size:15px}
.help h3{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--cinnabar-dark);margin:16px 0 6px}
.help h3:first-child{margin-top:0}

/* ---------- Toasts ---------- */
#toasts{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 16px))}
#toasts-top{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:rgba(43,26,16,.92);color:#ffeec4;border:2px solid var(--gold-dark);border-radius:10px;padding:6px 14px;font-size:clamp(12px,1.5vw,15px);line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:tin .25s ease-out;text-align:center;max-width:100%}
.toast.good{border-color:var(--jade);}
.toast.bad{border-color:var(--cinnabar)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .35s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.rotate-tip{display:none;font-size:12px;color:#d9c296;text-align:center}

@media (max-width:720px){
  #dlg{position:fixed;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40}
  #dlg .portrait{width:72px}
  .hc b{font-size:16px}
  .hc{min-height:30px;padding:2px 7px}
  #h-dayn{font-size:17px}
  .fbar{width:52px}
  .btn{font-size:16px;padding:6px 12px}
  .btn.big{font-size:19px}
  #b-open{min-width:0;flex:1 1 100%}
  #rail .rl{flex:1 1 100%;justify-content:space-between}
  #rail .rl .btn{flex:1 1 auto;justify-content:center;padding:6px 6px}
  .rotate-tip{display:block}
  .scroll-head h2{font-size:24px}
  .hud-spacer{display:none}
}
@media (max-width:520px){
  #hud{gap:5px 6px;padding:6px 8px}
  #hud .fbar,#hud .fame-l,#hud .en-l{display:none}
  #h-en i{width:9px;height:9px}
  .hbtn{min-width:30px;height:30px;padding:0 6px;font-size:13px}
  #toasts .toast:nth-last-child(n+3){display:none}
}
@media (orientation:landscape) and (max-height:540px){
  body{padding-block:6px 8px}
  #app{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"hud hud" "goal goal" "stage rail";gap:6px;max-width:none}
  #hud{grid-area:hud;padding:3px 8px;gap:4px 6px;flex-wrap:nowrap;overflow:hidden}
  #hud .fbar,#hud .fame-l,#hud .en-l{display:none}
  .hc{min-height:26px;padding:1px 7px}
  .hc b{font-size:15px}
  .hc img{width:18px;height:18px}
  #h-time{font-size:12px}
  .hbtn{min-width:28px;height:26px;padding:0 5px;font-size:12px}
  #h-en i{width:9px;height:9px}
  #h-day{flex-direction:row;gap:6px;align-items:center}
  #h-dayn{font-size:16px}
  #goalbar{grid-area:goal;font-size:12px;min-height:0}

      this.mus = this.ctx.createGain(); this.mus.gain.value = 0.16; this.mus.connect(this.master);
      const len = this.ctx.sampleRate * 1;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, o.slide), t + dur);

    g.gain.setValueAtTime(0.0001, t);

  startMusic() {
    if (!this.ctx || this.musicTimer) return;

      if (!this.ctx || !this.musicOn) return;

      }
    }, 90);
  },
  stopMusic() { if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; } },
};

const OUT = '#3a2214';

  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);

function plate(ctx, y, w, color) { ell(ctx, 0, y, w, w * 0.32); fs(ctx, color || '#f4f1ea'); ell(ctx, 0, y - 1, w * 0.7, w * 0.2); fs(ctx, null, 'rgba(90,120,170,.45)', 1); }

function drawPortrait(cv, look, expr, act) {
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!look) return;
  const s = W / 240 * 4.3;
  const tall = look.style === 'chefTall' ? 14 : look.style === 'official' || look.style === 'straw' ? 6 : 0;
  drawChar(ctx, { x: W * 0.47, y: H * 1.36 + tall * s, look, scale: s / (look.size || 1), facing: 1, expr: expr || 'normal', act: act || null, noShadow: true, t: performance.now() / 1000 });
}

function homeOf(role, idx) {

/* ---------- 移动 ---------- */
function moveAlong(e, dt, speed) {
  if (!e.path.length) return true;
  let rem = speed * dt;
  while (rem > 0 && e.path.length) {
    const p = e.path[0]; const dx = p.x - e.x, dy = p.y - e.y; const d = Math.hypot(dx, dy);
    if (Math.abs(dx) > 0.6) e.facing = dx > 0 ? 1 : -1;
    if (d <= rem) { e.x = p.x; e.y = p.y; rem -= d; e.path.shift(); } else { e.x += dx / d * rem; e.y += dy / d * rem; rem = 0; }
  }
  return !e.path.length;
}
function hallPath(from, to) {
  const pts = [];
  const lane = to.y > 530 || from.y > 530 && to.y > 500 ? GEO.FRONT_LANE : GEO.AISLE;
  if (Math.abs(from.y - to.y) > 14 || Math.abs(from.x - to.x) > 60) { pts.push({ x: from.x, y: lane }); pts.push({ x: to.x, y: lane }); }
  pts.push({ x: to.x, y: to.y });
  return pts;
}
const seatPos = (tb, j) => ({ x: tb.x + (j === 0 ? -1 : 1) * GEO.SEAT_DX * pscale(tb.y), y: tb.y, facing: j === 0 ? 1 : -1 });
const serviceSpot = tb => (tb.row === 0 ? { x: tb.x + 2, y: tb.y + 26 } : { x: tb.x + 2, y: tb.y - 22 });
const pscale = y => (y < 300 ? 0.8 : 0.84 + clamp((y - 412) / 160, 0, 1) * 0.16);
const curHour = () => OPEN_H + W.t / HOUR_SEC;

/* ---------- 客人 ---------- */
function spawnRate(hr) {
  const c = hr < 9 ? 0.65 : hr < 11 ? 0.55 : hr < 13 ? 1.45 : hr < 15 ? 0.65 : hr < 17 ? 0.6 : hr < 19 ? 1.45 : 0.8;
  const fameF = 1 + G.fame / (G.fame + 500);
  return BASE_FLOW[G.star] * c * fameF * flowMult() * W.ev.flow;
}
function pickType() {
  const keys = Object.keys(CTYPES).filter(k => !CTYPES[k].special);
  return weightedPick(keys, k => (CTYPES[k].w[G.star] || 0) * (W.ev.w[k] || 1));
}
function spawnParty(type, opts) {
  opts = opts || {};
  type = type || pickType();
  if (!type) return null;
  const ct = CTYPES[type];
  if (!opts.force && !ct.special && W.queue.length >= 3) { W.today.missed++; return null; }
  const n = opts.size || randi(ct.party[0], ct.party[1]);
  const p = {
    id: W.idc++, type, ct, members: [], state: 'arrive', table: null, patMax: ct.patience, patience: ct.patience, waitTotal: 0,
    tea: false, orders: [], favHits: 0, noFav: false, over: false, disturbed: false, timer: 0, t: 0,
    dash: !ct.special && G.day >= 3 && ['villager', 'swordsman', 'escort'].includes(type) && chance(0.03), special: opts.special || null, label: opts.label || null, hits: 0,
    orderClaim: null, judge: opts.judge != null ? opts.judge : null,
  };
  const svc = bestServe();
  p.patMax = p.patience = ct.patience * (1 + svc / 220);
  for (let j = 0; j < n; j++) {
    const look = opts.look && j === 0 ? opts.look : lookFor(type, j + (opts.judge || 0));
    p.members.push({ look, x: -30 - j * 16, y: GEO.STREET_Y + j * 3, facing: 1, pose: 'walk', act: null, expr: 'normal', t: rand(0, 5), path: [], alpha: 1, seat: j });
  }
  W.parties.push(p);
  if (type === 'thief') { p.state = 'sneak'; p.members.forEach(m => { m.pose = 'sneak'; m.path = [{ x: GEO.DOOR_IN.x, y: 552 }, { x: 236, y: 494 }]; }); return p; }
  if (type === 'thug') {
    p.state = 'barge';
    const tb = freeTable();
    if (tb) { tb.party = p; p.table = tb; }
    const spot = { x: rand(430, 600), y: 522 };
    p.members.forEach((m, j) => {
      const sp = tb ? seatPos(tb, j) : { x: spot.x + j * 30, y: spot.y };
      const lane = tb ? (tb.row ? GEO.FRONT_LANE : GEO.AISLE) : spot.y;
      m.path = [{ x: GEO.DOOR_IN.x, y: GEO.DOOR_IN.y }, { x: sp.x, y: lane }, { x: sp.x, y: sp.y }];
    });
    return p;
  }
  routeArrival(p);
  return p;
}
function routeArrival(p) {
  const tb = freeTable();
  if (tb && !W.queue.length) seatParty(p, tb);
  else { W.queue.push(p); p.state = 'arrive'; layoutQueue(); }
}
function layoutQueue() {
  W.queue.forEach((p, k) => {
    const spot = GEO.QUEUE[Math.min(k, GEO.QUEUE.length - 1)];
    p.members.forEach((m, j) => { m.path = [{ x: spot.x - j * 15 - (k >= GEO.QUEUE.length ? (k - 2) * 20 : 0), y: spot.y + j * 3 }]; m.pose = 'walk'; });
  });
}
function freeTable() { return W.tables.find(tb => !tb.party && !tb.dirty); }
function seatParty(p, tb) {
  tb.party = p; p.table = tb; p.state = 'toTable';
  p.dirtySeat = false;
  p.members.forEach((m, j) => {
    const sp = seatPos(tb, j);
    const lane = tb.row === 1 ? GEO.FRONT_LANE : GEO.AISLE;
    const pts = [];
    if (m.x < GEO.DOOR_IN.x - 4) pts.push({ x: GEO.DOOR_IN.x + j * 6, y: GEO.DOOR_IN.y + j * 2 });
    pts.push({ x: sp.x, y: lane }, { x: sp.x, y: sp.y });
    m.path = pts; m.pose = 'walk';
  });
  Sound.play('door');
}
function leaveQueue(p) { const i = W.queue.indexOf(p); if (i >= 0) { W.queue.splice(i, 1); layoutQueue(); } }
function exitParty(p, mood) {
  p.state = mood === 'run' ? 'dash' : 'leave';
  leaveQueue(p);
  if (p.table) { const tb = p.table; if (tb.party === p) { tb.party = null; if (p.ate) tb.dirty = true; tb.claim = null; } p.table = null; }
  p.members.forEach(m => {
    const pts = [];
    if (m.x > GEO.DOOR_IN.x + 10) { pts.push({ x: m.x, y: m.y > 530 ? GEO.FRONT_LANE : GEO.AISLE }); pts.push({ x: GEO.DOOR_IN.x, y: GEO.DOOR_IN.y }); }
    pts.push({ x: -50, y: GEO.STREET_Y + rand(-2, 4) });
    m.path = pts; m.pose = mood === 'run' ? 'run' : 'walk'; m.act = null;
    if (mood === 'angry') m.expr = 'angry'; else if (mood === 'happy') m.expr = 'happy'; else if (mood === 'sad') m.expr = 'sad';
  });
  W.tickets = W.tickets.filter(tk => tk.party !== p);
}
function fleeParty(p) {
  leaveQueue(p);
  if (p.table) { const tb = p.table; if (tb.party === p) { tb.party = null; tb.claim = null; if (p.ate) tb.dirty = true; } p.table = null; }
  p.state = 'flee';
  p.members.forEach(m => { m.pose = 'run'; m.act = null; m.path = [{ x: m.x, y: m.y > 530 ? GEO.FRONT_LANE : Math.max(m.y, GEO.AISLE) }, { x: GEO.DOOR_IN.x, y: GEO.DOOR_IN.y }, { x: -60, y: GEO.STREET_Y }]; });
}
function angryLeave(p, msg, fameLoss) {

function chooseDish(p, prefTag) {
  const ct = p.ct;
  const ok = G.menu.map(id => DISH[id]).filter(d => !d.tags.some(tg => ct.avoid.includes(tg)));
  if (!ok.length) return null;
  return weightedPick(ok, d => {
    let x = 1;
    if (prefTag && d.tags.includes(prefTag)) x *= 6;
    if (d.tags.some(tg => ct.fav.includes(tg))) x *= 4;
    const pr = dishPrice(d.id);
    if (pr > ct.budget) x *= 0.12;
    x *= 1 + Math.min(pr, ct.budget) / 50;
    if (d.secret) x *= 2;
    return x;
  });
}
function takeOrder(p, byBoss) {
  if (p.state !== 'order') return;
  p.state = 'wait';
  const ct = p.ct;
  const dishes = [];
  let fav = 0, over = false, none = false;
  p.members.forEach((m, j) => {
    const d = chooseDish(p, p.special === 'oldman' ? p.want : null);
    if (!d) { none = true; return; }
    dishes.push({ d, j });
    if (d.tags.some(tg => ct.fav.includes(tg))) fav++;
    if (dishPrice(d.id) > ct.budget) over = true;
  });
  if (none || !dishes.length) {
    p.state = 'order';
    const msg = p.type === 'monk' ? '阿弥陀佛，没有素菜……' : '没什么想吃的……';
    angryLeave(p, msg, 1);
    return;
  }
  if (ct.big && chance(0.5)) { const d = chooseDish(p); if (d) dishes.push({ d, j: 0 }); }
  if (p.type === 'judge' || p.type === 'critic') { const d = chooseDish(p); if (d && dishes.length < 2) dishes.push({ d, j: 0 }); }
  p.favHits = fav; p.noFav = fav === 0; p.over = over;
  dishes.forEach(({ d, j }) => {
    const o = { id: W.idc++, dish: d.id, member: j, status: 'pending', q: 0 };
    p.orders.push(o);
    W.tickets.push({ party: p, order: o, t: W.t });
  });
  p.orderClaim = null;
  Sound.play('order');
  if (byBoss) floatText(p.table.x, p.table.y - 84, '掌柜亲自招呼', '#fff3c4', 13);
}

function computeSat(p) {
  const ct = p.ct;
  let s = 55;
  const qs = p.orders.map(o => o.q); const avgQ = qs.length ? qs.reduce((a, b) => a + b, 0) / qs.length : 0.4;
  s += avgQ * 24;
  s += (p.favHits / p.members.length) * 10;
  if (p.noFav) s -= 8;
  if (p.over) s -= 6;
  const amb = ambience() + artistAmb();
  s += Math.min(18, amb / 2.2) - (ct.picky ? 7 : 0);
  s += comfort();
  s += Math.min(10, Math.max(0, (bestServe() - 18) / 5));
  if (ct.art && artistOn()) s += 8;
  s -= Math.max(0, p.waitTotal - 14) * 1.05 * (42 / ct.patience);
  if (p.tea) s += 4;
  if (p.disturbed) s -= 10;
  if (p.dirtySeat) s -= 5;
  if (p.special === 'oldman' && p.orders.some(o => DISH[o.dish].tags.includes(p.want))) s += 15;
  return clamp(Math.round(s), 0, 100);
}
function bestServe() { let b = 12; if (!W) return b; W.agents.forEach(a => { if (a.role === 'waiter') b = Math.max(b, sstat(a.s, 'serve') * sperf(a.s)); }); return b; }
function clerkAgent() { return W.agents.find(a => a.role === 'clerk'); }
function guardAgent() { return W.agents.find(a => a.role === 'guard'); }
function artistAgent() { return W.agents.find(a => a.role === 'artist'); }
function artistOn() { const a = artistAgent(); return !!(a && a.performing); }
function artistAmb() { const a = artistAgent(); return a && a.performing ? sstat(a.s, 'art') / 4 : 0; }

function finishMeal(p) {
  const ct = p.ct; const tb = p.table;
  const sat = computeSat(p);
  p.sat = sat; p.ate = true;
  let amount = 0;
  p.orders.forEach(o => { amount += o.price || dishPrice(o.dish); });
  const clerk = clerkAgent();
  if (clerk) amount = Math.round(amount * (1 + sstat(clerk.s, 'calc') / 650));
  let tip = 0;
  if (sat >= 82) tip = Math.round(amount * (ct.tip + 0.08));
  else if (sat >= 62) tip = Math.round(amount * ct.tip * 0.5);
  const sizeF = 1 + 0.5 * (p.members.length - 1);
  let fame = 0, word = '', col = '#fff3c4', expr = 'happy';
  if (sat >= 82) { fame = 4; word = pick(['赞不绝口！', '好！再来！', '妙极了！', '名不虚传！']); col = '#ffd84a'; W.today.great++; G.stats.great++; }
  else if (sat >= 62) { fame = 2; word = pick(['满意！', '不错不错', '好吃！']); }
  else if (sat >= 45) { fame = 1; word = pick(['还行', '凑合']); expr = 'normal'; }
  else if (sat >= 28) { fame = 0; word = '一般般……'; expr = 'normal'; col = '#e8d8b0'; }
  else { fame = -2; word = pick(['差评！', '什么破店！', '再也不来了！']); col = '#ff7a6a'; expr = 'angry'; W.today.bad++; }
  fame = fame >= 0 ? Math.round(fame * sizeF * ct.fame) : Math.round(fame * Math.max(1, ct.fame / 2));
  if (p.type === 'judge') W.judges.push(sat);
  p.members.forEach(m => { m.expr = expr; m.act = null; });
  W.today.served += p.members.length; G.stats.served += p.members.length;
  W.today.parties++; G.stats.parties++;
  if (p.type === 'critic') {
    const r = sat >= 82 ? '「此店当为落霞镇第一！」' : sat >= 62 ? '「有几分功夫。」' : sat >= 45 ? '「平平无奇。」' : '「难以下咽！」';
    say(p.members[0], r, 3);
    logEvent(`美食家白老饕点评：${r}`);
  }
  if (p.dash) {
    const catcher = (clerk && chance(sstat(clerk.s, 'calc') / 140)) ? clerk : (guardAgent() && chance(sstat(guardAgent().s, 'martial') / 160)) ? guardAgent() : null;
    if (catcher) { say(catcher, catcher.role === 'clerk' ? '站住！还没给钱呢！' : '……站住。', 2); floatText(tb.x, tb.y - 90, '想吃霸王餐？没门！', '#ffd84a'); }
    else {
      p.dashAmount = amount; p.dashFame = fame; p.dashWord = word;
      floatText(tb.x, tb.y - 90, '溜了溜了～', '#ff9a6a');
      exitParty(p, 'run');
      return;
    }
  }
  floatText(tb.x, tb.y - 92, word, col, 15);
  if (fame) addFame(fame, tb.x + 30, tb.y - 70);
  if (sat >= 82) Sound.play('happy'); else if (sat < 28) Sound.play('angry');
  W.coins.push({ x: tb.x, y: tb.y - 58, v: amount, tip, life: 0, auto: clerk ? 0.6 : 3.2, bob: rand(0, 6) });
  p.orders.forEach(o => { const sd = W.today.sold; sd[o.dish] = (sd[o.dish] || 0) + 1; dm(o.dish).sold++; });
  if (p.special === 'oldman') oldmanReward(p, sat);
  // 住店？
  const lodgeP = ct.lodge * W.ev.lodge * (curHour() >= 15 ? 1.3 : 0.55);
  const room = W.rooms.find(r => r.i < roomCount() && !r.occ);
  if (room && W.phase === 'business' && chance(lodgeP)) {
    room.occ = p.members.length; room.party = p; p.room = room; p.state = 'toRoom';
    tb.party = null; tb.dirty = true; tb.claim = null; p.table = null;
    W.today.rooms += roomPrice(); W.today.lodgers += p.members.length;
    floatText(tb.x, tb.y - 108, '住店！', '#9fe0ff', 13);
    p.members.forEach((m, j) => {
      const rx = GEO.ROOM_X[room.i] + (j ? 10 : 0);
      m.path = [{ x: m.x, y: GEO.AISLE }, { x: 748, y: GEO.AISLE }, { x: GEO.STAIR_BASE.x, y: GEO.STAIR_BASE.y }, { x: GEO.STAIR_TOP.x, y: GEO.STAIR_TOP.y }, { x: rx, y: GEO.CORRIDOR_Y }];
      m.pose = 'walk'; m.act = null;
    });
  } else exitParty(p, sat >= 62 ? 'happy' : sat < 28 ? 'angry' : 'calm');
}

function addFame(n, x, y) {
  if (!n) return;
  G.fame = Math.max(0, G.fame + n); W.today.fame += n;
  if (x != null) floatText(x, y, (n > 0 ? '+' : '') + n + ' 名气', n > 0 ? '#ff9a7a' : '#a8a8b8', 13, 'flower');
}

  if (x != null) floatText(x, y, (label || '') + '+' + n + '文', '#ffd84a', 15, 'coin');

/* ---------- 每帧更新 ---------- */
function updateWorld(dt) {
  W.anim += dt;
  const biz = W.phase === 'business' || W.phase === 'closing';
  if (biz) {
    W.t += dt;
    if (W.phase === 'business') {
      if (W.t >= DAY_SEC) beginClosing();
      else spawnTick(dt);
    } else {
      W.closeT += dt;
      const busy = W.parties.some(p => p.table || p.state === 'toTable');
      if (!busy && W.closeT > 2.5) endDay();
      else if (W.closeT > 28) { forceFinish(); }
    }
    updateParties(dt);
    updateAgents(dt);
    updateKitchen(dt);
    updateCoins(dt);
    W.enT += dt;
    if (W.enT >= 6) { W.enT = 0; if (W.en < energyMax()) { W.en++; UI.hud(); } }
  } else {
    updateAgentsIdle(dt);
  }
  updateFx(dt);
}
function spawnTick(dt) {
  const hr = curHour();
  if (chance(spawnRate(hr) * dt / HOUR_SEC)) spawnParty();
  for (const sp of W.specials) {
    if (!sp.done && hr >= sp.hour) { sp.done = true; const p = spawnParty(sp.type, Object.assign({ force: true }, sp.opts || {})); if (p && sp.onSpawn) sp.onSpawn(p); }
  }
  if (G.star >= 2 && W.today.thieves < 1 && chance(dt / HOUR_SEC * 0.03 * G.star)) { W.today.thieves++; spawnParty('thief', { force: true }); }
  if (G.star >= 2 && W.today.thugs < 1 && chance(dt / HOUR_SEC * 0.012 * G.star)) { W.today.thugs++; spawnParty('thug', { force: true }); }
}
function beginClosing() {
  W.phase = 'closing'; W.closeT = 0;
  Sound.play('gong');
  floatText(480, 330, '打 烊 咯', '#fff3c4', 30);
  [...W.queue].forEach(p => { say(p.members[0], '明儿再来！', 1.6); exitParty(p, 'calm'); });
  W.parties.forEach(p => { if (p.state === 'arrive') exitParty(p, 'calm'); if ((p.type === 'thug' || p.type === 'thief') && p.state !== 'flee') fleeParty(p); });
  UI.onPhase();
}
function forceFinish() {
  [...W.parties].forEach(p => {
    if (!p.table || p.state === 'leave' || p.state === 'dash') return;
    if (p.type === 'thug') { exitParty(p, 'calm'); return; }
    if (p.state === 'eat') { finishMeal(p); return; }
    if (p.state === 'wait' && p.orders.length) {
      p.orders.forEach(o => { if (o.status !== 'served') { o.status = 'served'; o.q = o.q || 0.45; o.price = o.price || dishPrice(o.dish); } });
      finishMeal(p); return;
    }
    exitParty(p, 'calm');
  });
  W.tickets = []; W.pass = [];
  W.agents.forEach(a => { if (a.task) releaseTask(a); a.cook = null; });
  W.coins.forEach(c => collectCoin(c, true)); W.coins = [];
  W.closeT = 0; W.forced = true;
  setTimeout(() => { if (W && W.phase === 'closing') endDay(); }, 400);
}
function updateParties(dt) {
  for (const p of W.parties) {
    p.t += dt;
    p.members.forEach(m => { m.t += dt; });
    const closing = W.phase === 'closing';
    switch (p.state) {
      case 'arrive': {
        let all = true; p.members.forEach(m => { if (!moveAlong(m, dt, 78)) all = false; else m.pose = 'stand'; });
        if (all) p.state = 'queue';
        p.waitTotal += dt * 0.3;
        break;
      }
      case 'queue': {
        p.members.forEach(m => { if (moveAlong(m, dt, 70)) { m.pose = 'stand'; m.facing = 1; } });
        if (W.queue[0] === p) { const tb = freeTable(); if (tb) { leaveQueue(p); seatParty(p, tb); break; } }
        if (!closing) { p.patience -= dt; p.waitTotal += dt; }
        if (p.patience < p.patMax * 0.35) p.members.forEach(m => { m.expr = 'sad'; });
        if (p.patience <= 0) { leaveQueue(p); angryLeave(p, '等这么久，走了！', 1); }
        break;
      }
      case 'toTable': {
        let all = true;
        p.members.forEach((m, j) => {
          if (moveAlong(m, dt, 80)) { const sp = seatPos(p.table, j); m.pose = 'sit'; m.facing = sp.facing; m.expr = 'normal'; } else { all = false; m.pose = 'walk'; }
        });
        if (all) { p.state = 'order'; p.timer = 0; }
        break;
      }
      case 'barge': {
        let all = true;
        p.members.forEach((m, j) => {
          if (moveAlong(m, dt, 86)) { if (p.table) { const sp = seatPos(p.table, j); m.pose = 'sit'; m.facing = sp.facing; } else { m.pose = 'stand'; m.facing = j ? -1 : 1; } } else { all = false; m.pose = 'walk'; }
        });
        if (all) { p.state = 'trouble'; p.timer = 0; say(p.members[0], pick(['小二！拿酒来！不给钱！', '这店谁罩着的？', '都给我让开！']), 2.4); markDisturb(); Sound.play('angry'); }
        break;
      }
      case 'order':
        if (!closing) { p.patience -= dt * 0.7; p.waitTotal += dt; }
        if (p.patience < p.patMax * 0.35) p.members.forEach(m => { m.expr = 'sad'; });
        if (p.patience <= 0) angryLeave(p, '没人招呼，走了！', 3);
        break;
      case 'wait':
        if (!closing) { p.patience -= dt * 0.55; p.waitTotal += dt; }
        if (p.patience < p.patMax * 0.3) p.members.forEach(m => { m.expr = 'sad'; });
        if (p.patience <= 0) { angryLeave(p, '菜也太慢了！', 3); break; }
        if (p.orders.length && p.orders.every(o => o.status === 'served')) {
          p.state = 'eat'; p.timer = (3.5 + p.orders.length * 1.4) * (closing ? 0.5 : 1);
          p.members.forEach(m => { m.act = 'eat'; m.expr = 'eat'; });
        }
        break;
      case 'eat':
        p.timer -= dt * (closing ? 2 : 1);
        if (p.timer <= 0) finishMeal(p);
        break;
      case 'leave': case 'dash': {
        let gone = true;
        p.members.forEach(m => { if (!moveAlong(m, dt, p.state === 'dash' ? 175 : 82)) gone = false; });
        if (gone) p.gone = true;
        if (p.state === 'dash' && p.members[0].x < 0 && !p.dashDone) {
          p.dashDone = true; W.today.dashLoss = (W.today.dashLoss || 0) + (p.dashAmount || 0);
          toast(`有客人吃了霸王餐，跑了！（损失 ${p.dashAmount} 文）`, 'bad');
        }
        break;
      }
      case 'toRoom': {
        let all = true;
        p.members.forEach(m => { if (!moveAlong(m, dt, 80)) all = false; else { m.alpha -= dt * 2; m.pose = 'stand'; m.facing = -1; } });
        if (all && p.members.every(m => m.alpha <= 0)) { p.gone = true; G.stats.lodgers += p.members.length; Sound.play('door'); }
        break;
      }
      case 'trouble': {
        p.timer += dt;
        p.members.forEach(m => { m.expr = 'angry'; m.act = Math.sin(p.t * 3) > 0.3 ? 'talk' : null; });
        if (Math.floor(p.timer / 3.2) !== Math.floor((p.timer - dt) / 3.2)) {
          markDisturb();
          const m = p.members[0]; burst(m.x + rand(-20, 20), m.y - 30, 6, '#f6efe0');
          Sound.play('hit');
          say(m, pick(['砸了这破店！', '哼！', '谁敢管老子？', '拿钱来！']), 1.6);
        }
        if (p.timer > 24) {
          const loss = Math.min(G.money, 30 + G.star * 10);
          G.money -= loss; W.today.lost += loss;
          addFame(-4, p.members[0].x, p.members[0].y - 70);
          toast(`地痞砸了店，抢走 ${loss} 文！请个护院吧`, 'bad');
          if (p.table) p.table.mess = 1;
          p.ate = true; exitParty(p, 'calm'); p.members.forEach(m => { m.expr = 'sly'; });
        }
        break;
      }
      case 'sneak': {
        const m = p.members[0];
        if (moveAlong(m, dt, 46)) { p.state = 'steal'; p.timer = 0; m.act = 'calc'; m.facing = -1; }
        break;
      }
      case 'steal': {
        p.timer += dt;
        if (p.timer > 3.2) {
          const loss = Math.min(G.money, Math.round(20 + G.money * 0.06));
          G.money -= loss; W.today.lost += loss; UI.hud();
          floatText(p.members[0].x, p.members[0].y - 80, `-${loss}文`, '#ff7a6a', 15);
          toast(`柜台被小毛贼摸走了 ${loss} 文！`, 'bad');
          fleeParty(p); p.members.forEach(m => { m.expr = 'sly'; });
        }
        break;
      }
      case 'flee': {
        let gone = true; p.members.forEach(m => { if (!moveAlong(m, dt, 190)) gone = false; });
        if (gone) p.gone = true;
        break;
      }
    }
    if (p.special === 'oldman' && p.vanish) { p.members.forEach(m => { m.alpha -= dt * 1.5; }); if (p.members[0].alpha <= 0) p.gone = true; }
  }
  W.parties = W.parties.filter(p => !p.gone);
}
function markDisturb() { W.parties.forEach(q => { if (q.table && q.type !== 'thug') { q.disturbed = true; q.patience -= 4; } }); }

/* ---------- 后厨 ---------- */
function updateKitchen(dt) {
  const cooks = W.agents.filter(a => a.role === 'cook');
  if (!cooks.length) {
    // 没有厨子：掌柜亲自下厨，很慢
    if (!W.bossCook && W.tickets.length) { const tk = W.tickets.shift(); W.bossCook = { tk, left: DISH[tk.order.dish].time * 2.2 }; if (!G.seenTips.bossCook) { G.seenTips.bossCook = 1; toast('没有厨子，掌柜只好亲自下厨……出菜很慢，快去招个厨子！', 'bad'); } }
    if (W.bossCook) { W.bossCook.left -= dt; if (W.bossCook.left <= 0) { plateDish(W.bossCook.tk, 0.25, 15); W.bossCook = null; } }
  }
}
function plateDish(tk, cookStat, mGain) {
  const o = tk.order, p = tk.party;
  const d = DISH[o.dish];
  W.today.cost += Math.round(d.cost * costMult() * W.ev.costMul);
  const md = dm(o.dish);
  o.q = clamp(0.2 + cookStat / 190 + md.m / 260 + rand(-0.08, 0.08), 0, 1);
  o.price = dishPrice(o.dish);
  md.m = Math.min(100, md.m + mGain);
  if (!p.table || p.state !== 'wait') return; // 客人走了，菜白做
  o.status = 'ready';
  const slot = W.pass.length;
  W.pass.push({ id: W.idc++, party: p, order: o, x: 798 + (slot % 4) * 19, y: 424 - Math.floor(slot / 4) * 9, claim: null, t: 0, fly: null });
  Sound.play('dish');
}
function relayoutPass() { W.pass.forEach((ps, i) => { ps.x = 798 + (i % 4) * 19; ps.y = 424 - Math.floor(i / 4) * 9; }); }

/* ---------- 伙计 ---------- */
function say(e, text, dur) { e.say = text; e.sayT = dur || 1.8; }
function staffSay(a, kind, p) {
  if (W.sayCD > 0 || !chance(p == null ? 0.3 : p)) return;
  const ls = a.d.lines[kind]; if (!ls) return;
  say(a, pick(ls), 1.8); W.sayCD = 2.2;
}
function updateAgentsIdle(dt) {
  [...W.agents, W.boss].forEach(a => {
    a.t += dt; if (a.sayT > 0) a.sayT -= dt;
    if (a.path.length) { a.pose = 'walk'; if (moveAlong(a, dt, 90)) a.pose = 'stand'; }
    if (a.role === 'guard' && a.d && a.s.id === 'laomao') a.act = 'sleep';
    else if (a.kind === 'staff') a.act = null;
  });
}
function updateAgents(dt) {
  W.sayCD -= dt;
  const b = W.boss; b.t += dt; if (b.sayT > 0) b.sayT -= dt;
  b.act = W.coins.length ? 'calc' : null; b.expr = W.today.angry > W.today.great + 2 ? 'sad' : 'normal';
  for (const a of W.agents) {
    a.t += dt; if (a.sayT > 0) a.sayT -= dt;
    const s = a.s; const perf = sperf(s);
    const spd = (68 + sstat(s, 'speed') * 1.3) * perf;
    const working = a.task || a.cook || a.performing || a.fight;
    if (working) { s.energy = Math.max(0, s.energy - dt * 0.32); a.workT += dt; }
    switch (a.role) {
      case 'waiter': updateWaiter(a, dt, spd); break;
      case 'cook': updateCook(a, dt, perf); break;
      case 'clerk': a.act = W.coins.length || a.t % 9 < 3 ? 'calc' : null; break;
      case 'guard': updateGuard(a, dt, spd); break;
      case 'artist': updateArtist(a, dt); break;
    }
  }
}
function releaseTask(a) {
  const tk = a.task; if (!tk) return;
  if (tk.type === 'order' && tk.party) tk.party.orderClaim = null;
  if (tk.type === 'clean' && tk.table) tk.table.claim = null;
  if (tk.type === 'deliver' && tk.ps) tk.ps.claim = null;
  a.task = null; a.holding = null; a.act = null;
}
function findWaiterTask(a) {
  let best = null, bs = -1e9;
  const consider = (score, task, pt) => { const s2 = score - dist(a.x, a.y, pt.x, pt.y) / 9; if (s2 > bs) { bs = s2; best = task; } };
  W.pass.forEach(ps => { if (!ps.claim && !ps.fly && ps.party.table) consider(100 + ps.t * 3, { type: 'deliver', ps, stage: 'pickup' }, GEO.PICKUP); });
  W.parties.forEach(p => { if (p.state === 'order' && !p.orderClaim && p.table) consider(92 + p.t * 0.3 + (p.patMax - p.patience) * 1.2, { type: 'order', party: p }, serviceSpot(p.table)); });
  W.tables.forEach(tb => { if (tb.dirty && !tb.claim && !tb.party) consider(60 + (W.queue.length ? 34 : 0), { type: 'clean', table: tb }, serviceSpot(tb)); });
  return best;
}
function updateWaiter(a, dt, spd) {
  if (!a.task) {
    a.retry = (a.retry || 0) - dt;
    if (a.retry <= 0) {
      a.retry = 0.15;
      const tk = findWaiterTask(a);
      if (tk) {
        a.task = tk;
        if (tk.type === 'deliver') { tk.ps.claim = a; a.path = hallPath(a, GEO.PICKUP); }
        if (tk.type === 'order') { tk.party.orderClaim = a; a.path = hallPath(a, serviceSpot(tk.party.table)); }
        if (tk.type === 'clean') { tk.table.claim = a; a.path = hallPath(a, serviceSpot(tk.table)); }
      }
    }
    if (!a.task) {
      if (!a.path.length && dist(a.x, a.y, a.home.x, a.home.y) > 4) a.path = hallPath(a, a.home);
      if (a.path.length) { a.pose = 'walk'; moveAlong(a, dt, spd * 0.7); } else { a.pose = 'stand'; a.act = null; a.facing = -1; }
      return;
    }
  }
  const tk = a.task;
  // 任务失效检查
  if (tk.type === 'order' && (tk.party.state !== 'order' || !tk.party.table)) { releaseTask(a); return; }
  if (tk.type === 'clean' && (!tk.table.dirty || tk.table.party)) { releaseTask(a); return; }
  if (tk.type === 'deliver' && (!W.pass.includes(tk.ps) && tk.stage === 'pickup' || !tk.ps.party.table)) { if (tk.stage === 'carry') W.pass = W.pass.filter(x => x !== tk.ps); releaseTask(a); return; }
  if (a.path.length) { a.pose = 'walk'; a.act = a.holding ? 'hold' : null; moveAlong(a, dt, spd); return; }
  a.pose = 'stand';
  switch (tk.type) {
    case 'order':
      a.facing = tk.party.table.x >= a.x ? 1 : -1; a.act = 'write'; a.timer += dt;
      if (a.timer >= 0.9) { a.timer = 0; takeOrder(tk.party); staffSay(a, 'work', 0.35); a.task = null; a.act = null; gainExp(a, 2); }
      break;
    case 'clean':
      a.act = 'wipe'; a.facing = tk.table.x >= a.x ? 1 : -1; a.timer += dt;
      if (a.timer >= 1.2) { a.timer = 0; cleanTable(tk.table); a.task = null; a.act = null; gainExp(a, 1); }
      break;
    case 'deliver':
      if (tk.stage === 'pickup') {
        W.pass = W.pass.filter(x => x !== tk.ps); relayoutPass();
        a.holding = DISH[tk.ps.order.dish].icon; tk.stage = 'carry'; a.act = 'hold';
        a.path = hallPath(a, serviceSpot(tk.ps.party.table));
      } else {
        serveOrder(tk.ps); a.holding = null; a.act = null; a.task = null; staffSay(a, 'work', 0.3); gainExp(a, 2);
      }
      break;
  }
}
function serveOrder(ps) {
  const o = ps.order; o.status = 'served';
  const tb = ps.party.table;
  if (tb) { tb.flash = 0.3; }
  Sound.play('pop');
}
function cleanTable(tb) { tb.dirty = false; tb.mess = 0; tb.claim = null; burst(tb.x, tb.y - 30, 8, '#ffffff', 'spark'); Sound.play('wipe'); }
function gainExp(a, n) { a.s.exp += n; }

function updateCook(a, dt, perf) {
  a.facing = 1;
  if (!a.cook) {
    a.act = null;
    if (W.tickets.length) {
      const tk = W.tickets.shift();
      const cs = sstat(a.s, 'cook');
      const time = DISH[tk.order.dish].time * Math.max(0.42, 1.38 - cs / 115) / cookSpeedMult() / perf;
      a.cook = { tk, left: time, total: time };
      tk.order.status = 'cooking';
      if (chance(0.25)) Sound.play('sizzle');
    }
    return;
  }
  a.act = 'cook';
  a.cook.left -= dt;
  if (a.cook.left <= 0) {
    const cs = sstat(a.s, 'cook');
    plateDish(a.cook.tk, cs * sperf(a.s), 1 + cs / 45);
    gainExp(a, 2); staffSay(a, 'work', 0.25);
    a.cook = null;
  }
}
function updateGuard(a, dt, spd) {
  const sleepy = a.s.id === 'laomao';
  if (!a.target) {
    const thug = W.parties.find(p => p.state === 'trouble' && !p.guarded);
    const thief = W.parties.find(p => (p.state === 'sneak' || p.state === 'steal') && !p.guarded && p.members[0].x > 160);
    const tgt = thug || (thief && chance(dt * sstat(a.s, 'martial') / 70) ? thief : null);
    if (tgt) {
      a.target = tgt; tgt.guarded = a;
      const m = tgt.members[0];
      a.path = hallPath(a, { x: m.x - 24, y: Math.max(m.y, 480) + 4 });
      a.act = null; if (sleepy) say(a, '……吵死了。', 1.4);
    } else {
      if (!a.path.length && dist(a.x, a.y, a.home.x, a.home.y) > 4) a.path = hallPath(a, a.home);
      if (a.path.length) { a.pose = 'walk'; moveAlong(a, dt, spd * 0.7); a.act = null; } else { a.pose = 'stand'; a.act = sleepy ? 'sleep' : null; a.facing = 1; }
      return;
    }
  }
  const p = a.target;
  if (!W.parties.includes(p) || !['trouble', 'sneak', 'steal', 'barge'].includes(p.state)) { a.target = null; a.fight = 0; a.act = null; return; }
  if (a.path.length) { a.pose = 'walk'; a.act = null; moveAlong(a, dt, spd * (sleepy ? 1.6 : 1.1)); return; }
  a.pose = 'stand'; a.act = 'fight'; a.facing = p.members[0].x >= a.x ? 1 : -1;
  a.fight = (a.fight || 0) + dt;
  if (Math.floor(a.fight * 3) !== Math.floor((a.fight - dt) * 3)) { burst(p.members[0].x, p.members[0].y - 40, 4, '#ffe08a', 'star'); Sound.play('hit'); }
  const need = p.type === 'thief' ? 1.2 : 7 * 50 / sstat(a.s, 'martial');
  if (a.fight >= need) { a.fight = 0; a.target = null; a.act = null; subdue(p, a); gainExp(a, 6); }
}
function subdue(p, by) {

  }

  Sound.play('catch');
  p.ate = true;
  fleeParty(p);
  p.members.forEach(mm => { mm.expr = 'sad'; });
  if (by && by.kind === 'staff') say(by, by.s.id === 'laomao' ? '喵。' : by.d.lines.work[0], 1.4);
}
function updateArtist(a, dt) {
  if (!G.build.stage) { a.performing = false; a.act = null; return; }
  a.perfT += dt;
  const cyc = a.perfT % 26;
  a.performing = cyc < 20;
  a.act = a.performing ? 'play' : null;

  if (a.performing && Math.floor(a.perfT * 1.5) !== Math.floor((a.perfT - dt) * 1.5)) W.fx.push({ k: 'note', x: a.x + rand(-6, 16), y: a.y - 60, vx: rand(-8, 8), vy: -26, life: 1.6, max: 1.6, c: pick(['#c0392b', '#3a78a6', '#8a5cc4']) });

/* ---------- 铜钱 ---------- */
function updateCoins(dt) {

/* ---------- 特效 ---------- */
function floatText(x, y, text, color, size, icon) { W.fx.push({ k: 'text', x, y, text, c: color || '#fff', size: size || 14, icon, life: 1.5, max: 1.5 }); }
function burst(x, y, n, color, kind) { for (let i = 0; i < n; i++) { const a = rand(0, TAU), v = rand(30, 90); W.fx.push({ k: kind || 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: rand(0.4, 0.8), max: 0.8, c: color }); } }
function confetti(n) { for (let i = 0; i < n; i++) W.fx.push({ k: 'paper', x: rand(100, 900), y: rand(-40, 0), vx: rand(-20, 20), vy: rand(60, 140), rot: rand(0, 6), vr: rand(-6, 6), life: rand(2.5, 4), max: 4, c: pick(['#e8483a', '#f3c34f', '#c0392b', '#ff8a6a']) }); }
function updateFx(dt) {
  for (const f of W.fx) {
    f.life -= dt;
    switch (f.k) {
      case 'text': f.y -= dt * 22; break;
      case 'dot': case 'spark': case 'star': f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 160 * dt; break;
      case 'note': f.x += f.vx * dt + Math.sin(f.life * 6) * 0.4; f.y += f.vy * dt; break;
      case 'paper': f.x += f.vx * dt + Math.sin(f.life * 3) * 0.6; f.y += f.vy * dt; f.rot += f.vr * dt; break;
      case 'coinfly': { const p = 1 - f.life / f.max; f.x = lerp(f.sx, f.tx, easeOut(p)); f.y = lerp(f.sy, f.ty, p) - Math.sin(p * Math.PI) * 50; break; }
      case 'fly': { const p = clamp(1 - f.life / f.max, 0, 1); f.x = lerp(f.sx, f.tx, p); f.y = lerp(f.sy, f.ty, p) - Math.sin(p * Math.PI) * 60; if (f.life <= 0 && f.done) f.done(); break; }
      case 'smoke': f.x += f.vx * dt; f.y += f.vy * dt; break;
    }
  }
  W.fx = W.fx.filter(f => f.life > 0);
}

/* ---------- 掌柜亲自动手（点击） ---------- */
function spendEnergy() {
  if (W.en >= 1) { W.en--; W.enT = Math.min(W.enT, 0); UI.hud(); return true; }
  Sound.play('deny'); toast('掌柜累了，歇口气……（精力会慢慢恢复）'); return false;
}
function clickParty(p) {

      p.members.forEach(mm => { mm.expr = 'happy'; });

      break;
    case 'order':

      takeOrder(p, true);
      break;
    case 'trouble':

const Dlg = {
  open: false, queue: [], cur: null, shown: 0, full: '', resolve: null, typing: false, acc: 0,
  who(id) {
    if (id === 'boss') return { name: G.name, look: (G.gender === 'f' ? NPC.boss_f : NPC.boss_m).look };
    if (id === 'narr') return { name: '', look: null };
    if (id === 'sys') return { name: '小贴士', look: null };
    if (STAFF[id]) return { name: STAFF[id].name, look: STAFF[id].look };
    if (NPC[id]) return { name: NPC[id].name, look: NPC[id].look };
    return { name: id, look: null };
  },
  fill(text) { return text.replace(/\{name\}/g, G.name).replace(/\{nephew\}/g, G.gender === 'f' ? '侄女' : '侄儿').replace(/\{kid\}/g, G.gender === 'f' ? '臭丫头' : '臭小子'); },
  run(lines) {
    return new Promise(res => {
      if (!lines || !lines.length) { res(); return; }
      this.queue = lines.slice(); this.resolve = res; this.open = true;
      $('#dlg').hidden = false;
      this.next();
    });
  },
  next() {
    const el = $('#dlg');
    if (!this.queue.length) {
      this.open = false; el.hidden = true; this.cur = null;
      const r = this.resolve; this.resolve = null; if (r) r();
      return;
    }
    const ln = this.queue.shift();
    if (typeof ln === 'function') { const more = ln(); if (Array.isArray(more)) this.queue.unshift(...more); this.next(); return; }
    this.cur = ln;
    const w = this.who(ln.who);
    $('.name', el).textContent = ln.name || w.name;
    const pt = $('.portrait', el);
    pt.classList.toggle('none', !w.look);
    this.look = w.look; this.expr = ln.expr || 'normal';
    if (w.look) drawPortrait($('canvas', pt), w.look, this.expr, 'talk');
    this.full = this.fill(ln.text); this.shown = 0; this.typing = true; this.acc = 0;
    $('.text', el).textContent = '';
    $('.text', el).style.fontStyle = ln.who === 'narr' ? 'italic' : 'normal';
    $('.text', el).style.color = ln.who === 'narr' ? '#5a4a3a' : ln.who === 'sys' ? '#2a5a3a' : '';
    const ch = $('.choices', el); ch.innerHTML = '';
    $('.more', el).style.visibility = 'hidden';
  },
  tick(dt) {
    if (!this.open || !this.cur) return;
    const el = $('#dlg');
    if (this.typing) {
      this.acc += dt * 42;
      const n = Math.min(this.full.length, Math.floor(this.acc));
      if (n !== this.shown) { this.shown = n; $('.text', el).textContent = this.full.slice(0, n); if (n % 3 === 0) Sound.play('type'); }
      if (this.look && Math.floor(this.acc) % 4 === 0) drawPortrait($('canvas', $('.portrait', el)), this.look, this.expr, this.shown < this.full.length ? 'talk' : null);
      if (this.shown >= this.full.length) this.finishTyping();
    }
  },
  finishTyping() {
    const el = $('#dlg');
    this.typing = false; this.shown = this.full.length; $('.text', el).textContent = this.full;
    if (this.look) drawPortrait($('canvas', $('.portrait', el)), this.look, this.expr, null);
    const ln = this.cur;
    if (ln.choices) {
      const ch = $('.choices', el); ch.innerHTML = '';
      ln.choices.forEach(c => {
        const b = h('button', { class: 'btn small' + (c.red ? ' red' : c.green ? ' green' : ''), onclick: e => { e.stopPropagation(); Sound.play('click'); const more = c.fn ? c.fn() : null; if (Array.isArray(more)) this.queue.unshift(...more); this.next(); } }, c.text);
        if (c.disabled) b.disabled = true;
        ch.appendChild(b);
      });
      $('.more', el).style.visibility = 'hidden';
    } else $('.more', el).style.visibility = 'visible';
  },
  click() {
    if (!this.open || !this.cur) return;
    if (this.typing) { this.finishTyping(); return; }
    if (this.cur.choices) return;
    Sound.play('click');
    this.next();
  },
};

function drawLedgerChart(cv) {
  const ctx = cv.getContext('2d'); const W2 = cv.width, H2 = cv.height;
  ctx.clearRect(0, 0, W2, H2);
  const data = G.hist.slice(-14);
  ctx.font = '22px ' + FONT_U; ctx.fillStyle = '#8a6a4a';
  if (!data.length) { ctx.textAlign = 'center'; ctx.fillText('打烊结账后，这里会画出每天的流水', W2 / 2, H2 / 2); return; }
  const padL = 70, padR = 70, padT = 20, padB = 46;
  const maxNet = Math.max(100, ...data.map(d => Math.abs(d.net)));
  const maxFame = Math.max(50, ...data.map(d => d.fame));
  const bw = (W2 - padL - padR) / 14;
  const zeroY = padT + (H2 - padT - padB) * (maxNet / (maxNet * (data.some(d => d.net < 0) ? 2 : 1)));
  const scaleY = (zeroY - padT) / maxNet;
  ctx.strokeStyle = 'rgba(120,80,40,.2)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(padL, zeroY); ctx.lineTo(W2 - padR, zeroY); ctx.stroke();
  data.forEach((d, i) => {
    const x = padL + i * bw + bw * 0.18, w = bw * 0.64;
    const hh = d.net * scaleY;
    ctx.fillStyle = d.net >= 0 ? '#d9a33a' : '#c0392b';
    ctx.fillRect(x, d.net >= 0 ? zeroY - hh : zeroY, w, Math.abs(hh));
    ctx.fillStyle = '#6a4a30'; ctx.textAlign = 'center'; ctx.font = '20px ' + FONT_U;
    ctx.fillText('第' + d.d + '天', x + w / 2, H2 - 14);
    if (i === data.length - 1 || data.length <= 7) { ctx.fillStyle = '#2a1a10'; ctx.fillText(fmt(d.net), x + w / 2, (d.net >= 0 ? zeroY - hh : zeroY + Math.abs(hh)) + (d.net >= 0 ? -8 : 22)); }
  });
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 4; ctx.beginPath();
  data.forEach((d, i) => { const x = padL + i * bw + bw / 2, y = padT + (H2 - padT - padB) * (1 - d.fame / maxFame); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
  ctx.stroke();
  data.forEach((d, i) => { const x = padL + i * bw + bw / 2, y = padT + (H2 - padT - padB) * (1 - d.fame / maxFame); ctx.fillStyle = '#c0392b'; circ(ctx, x, y, i === data.length - 1 ? 8 : 5); ctx.fill(); });
  const last = data[data.length - 1]; ctx.fillStyle = '#c0392b'; ctx.textAlign = 'left'; ctx.font = '20px ' + FONT_U;
  ctx.fillText('名气 ' + fmt(last.fame), W2 - padR + 6, padT + (H2 - padT - padB) * (1 - last.fame / maxFame) + 6);
}

const Flow = {
  /* ---------- 存档 ---------- */
  save(manual) {
    if (!G || G.demo) return;
    const ok = Store.set(SAVE_KEY, G);
    try { lastSaved = JSON.parse(JSON.stringify(G)); } catch (e) { /* ignore */ }
    if (manual) toast(ok ? '进度已保存' : '保存失败：浏览器不让写入本机存储', ok ? 'good' : 'bad');
  },
  load() {
    const g = Store.get(SAVE_KEY, null);
    if (!g || !g.v || !g.staff) return false;
    G = g;
    BUILDS.forEach(b => { if (G.build[b.id] == null) G.build[b.id] = 0; });
    G.seenTips = G.seenTips || {}; G.flags = G.flags || {}; G.log = G.log || []; G.hist = G.hist || [];
    return true;
  },
  hasSave() { const g = Store.get(SAVE_KEY, null); return !!(g && g.v && g.staff); },

  /* ---------- 标题 ---------- */
  toTitle() {
    UI.showGame(false);
    $('#dlg').hidden = true; Dlg.open = false;
    makeDemo();
    const box = $('#title-btns'); box.innerHTML = '';
    const has = this.hasSave();
    if (has) {
      const g = Store.get(SAVE_KEY, null);
      box.appendChild(h('button', { class: 'btn red big', onclick: () => { audioKick(); this.continueGame(); } }, `继续经营（第${cnNum(g.day)}天）`));
    }
    box.appendChild(h('button', { class: 'btn big' + (has ? '' : ' red'), onclick: () => { audioKick(); this.newGameForm(); } }, has ? '重新开张' : '接手客栈'));
    box.appendChild(h('button', { class: 'btn', onclick: () => { audioKick(); UI.modal('游戏说明', null, b => Panels.help.render(b)); } }, '游戏说明'));
  },
  newGameForm() {

      body.appendChild(h('div', { class: 'field' }, h('label', null, '掌柜的模样'), h('div', { class: 'looks' }, opt('m', '少东家'), opt('f', '女掌柜'))));
      const err = h('p', { class: 'hint', style: 'color:#c0392b', hidden: true }, '名号不能为空');

  async startNew(name, gender) {

    newWorld();
    UI.showGame(true);
    G.daily = null;
    UI.onPhase();
    await Dlg.run(STORY.intro());
    this.prepMorning(true);

  continueGame() {
    if (!this.load()) { this.newGameForm(); return; }
    newWorld();
    UI.showGame(true);
    if (!G.daily) G.daily = genDaily();
    this.applyMorningState();
    UI.onPhase();
    toast(`欢迎回来，${G.name}掌柜！`, 'good');
  },

  /* ---------- 一天的流程 ---------- */
  async prepMorning(first) {
    W.phase = 'morning';
    G.daily = genDaily();
    this.applyMorningState();
    UI.onPhase();
    if (!first) await this.morningStory();
    UI.hud();
  },
  applyMorningState() {
    W.ev = W.ev || {};
    if (G.todayEv && G.todayEv.day === G.day) Object.assign(W.ev, G.todayEv.ev);
    if (G.flags.contestDay === G.day) setupContest();
  },
  async morningStory() {
    const lines = [];
    const beat = STORY.morningBeat();
    if (beat) lines.push(...beat);
    else if (G.day >= 3 && chance(0.6) && !G.flags.contestDay || (G.flags.contestDay && G.flags.contestDay !== G.day && chance(0.5))) {
      const ev = pickEvent();
      if (ev) { lines.push(...ev.run()); G.evSeen = G.evSeen || {}; G.evSeen[ev.id] = G.day; }
    }
    if (G.flags.contestDay === G.day) lines.push(...STORY.contestMorning());
    G.todayEv = { day: G.day, ev: { flow: W.ev.flow, lodge: W.ev.lodge, w: W.ev.w, rain: W.ev.rain, costMul: W.ev.costMul, name: W.ev.name } };
    if (lines.length) await Dlg.run(lines);
    UI.hud();
  },
  openShop() {
    if (!W || W.phase !== 'morning' || Dlg.open) return;
    W.phase = 'business'; W.t = 0;
    Sound.play('gong');
    floatText(480, 330, '开 张 咯', '#fff3c4', 30);
    if (G.day === 1) { W.specials.push({ hour: 7.15, type: 'villager', opts: { size: 1 } }); }
    UI.onPhase();
    tipOnce('open', '开张啦！客人陆续上门。中午和傍晚是饭点。');
  },
  goalText(g) {
    switch (g.k) {
      case 'served': return `接待 ${g.n} 位客人`;
      case 'income': return `菜钱和赏钱收满 ${g.n} 文`;
      case 'great': return `${g.n} 桌客人赞不绝口`;
      case 'nobad': return '一个差评、一位甩手走人的客人都没有';
      case 'sell': return `卖出 ${g.n} 份${DISH[g.dish] ? DISH[g.dish].name : '菜'}`;
    }
    return '';
  },
  goalProgress(g) {
    const T = W.today; let cur = 0;
    switch (g.k) {
      case 'served': cur = T.served; break;
      case 'income': cur = T.food + T.tips; break;
      case 'great': cur = T.great; break;
      case 'nobad': return [0, W.phase === 'night' && T.bad === 0 && T.angry === 0];
      case 'sell': cur = T.sold[g.dish] || 0; break;
    }
    return [cur, cur >= g.n];
  },
  starReqs(star) {
    const r = STARS[star]; if (!r) return [];
    const list = [];
    if (r.fame) list.push({ name: '名气', cur: G.fame, need: r.fame });
    if (r.tables) list.push({ name: '大堂桌子', cur: tableCount(), need: r.tables });
    if (r.served) list.push({ name: '累计接待客人', cur: G.stats.served, need: r.served });
    if (r.rooms) list.push({ name: '能住人的客房', cur: roomCount(), need: r.rooms });
    if (r.dishes) list.push({ name: '会做的菜', cur: G.unlocked.length, need: r.dishes });
    if (r.amb) list.push({ name: '大堂环境', cur: ambience(), need: r.amb });
    if (r.staff) list.push({ name: '伙计人数', cur: G.staff.length, need: r.staff });
    if (r.sign) list.push({ name: '招牌', cur: G.build.sign, need: r.sign, fmt: v => ['旧木匾', '新漆牌匾', '金字招牌'][v] });
    return list;
  },
  canStarUp() { return G.star < 5 && this.starReqs(G.star + 1).every(q => q.cur >= q.need); },

  /* ---------- 打烊结账 ---------- */
  settle() {
    const T = W.today;
    const rep = { day: G.day, served: T.served, parties: T.parties, great: T.great, bad: T.bad, angry: T.angry, food: T.food, tips: T.tips, rooms: T.rooms, cost: T.cost, lost: T.lost, dash: T.dashLoss || 0, missed: T.missed, fame: T.fame, thugs: T.thugs, thieves: T.thieves };
    G.money += T.rooms;
    G.money -= T.cost;
    const wages = G.staff.reduce((s, st) => s + STAFF[st.id].wage, 0);
    let paid = wages, unpaid = false;
    if (G.money < wages) { paid = Math.max(0, G.money); unpaid = true; }
    G.money = Math.max(0, G.money - paid);
    rep.wages = paid; rep.unpaid = unpaid;
    rep.net = T.food + T.tips + T.rooms - T.cost - paid - T.lost;
    // 每日目标
    const g = G.daily;
    if (g) { W.phase = 'night'; const [, done] = this.goalProgress(g); if (done) { G.money += g.reward; rep.goal = g; rep.net += g.reward; } }
    // 伙计
    rep.levelUps = []; rep.quit = []; rep.warn = [];
    G.staff.forEach(s => {
      const a = W.agents.find(x => x.s === s);
      s.exp += Math.round((a ? a.workT : 0) / 6);
      while (s.lv < 10 && s.exp >= expNeed(s.lv)) { s.exp -= expNeed(s.lv); s.lv++; rep.levelUps.push(s); }
      if (s.lv >= 10) s.exp = 0;
      let dmood = 2 + (G.build.dorm ? 5 : 0);
      if (s.energy < 20) dmood -= 8;
      if (unpaid) dmood -= 18;
      if (T.great >= 5) dmood += 2;
      s.mood = clamp(s.mood + dmood, 0, 100);
      s.energy = 100;
      if (s.mood < 20) { s.low = (s.low || 0) + 1; if (!STAFF[s.id].start) rep.warn.push(s); } else s.low = 0;
    });
    G.staff.filter(s => s.low >= 2 && !STAFF[s.id].start).forEach(s => { rep.quit.push(s); });
    G.staff = G.staff.filter(s => !rep.quit.includes(s));
    rep.quit.forEach(s => logEvent(`${STAFF[s.id].name}心灰意冷，卷铺盖走了`));
    G.stats.days++;
    G.stats.bestDay = Math.max(G.stats.bestDay, rep.net);
    G.hist.push({ d: G.day, net: rep.net, fame: G.fame, served: T.served, food: T.food + T.tips, great: T.great });
    if (G.hist.length > 60) G.hist.shift();
    rep.starUp = this.canStarUp();
    if (rep.starUp) G.star++;
    checkQuests();
    return rep;

  train(s, cost) {
    if (G.money < cost || s.trained === G.day) return;
    G.money -= cost; s.trained = G.day; s.exp += 30; s.energy = Math.max(0, s.energy - 15);
    const before = s.lv;
    while (s.lv < 10 && s.exp >= expNeed(s.lv)) { s.exp -= expNeed(s.lv); s.lv++; }
    Sound.play('buy');
    toast(s.lv > before ? `${STAFF[s.id].name}升到了 ${s.lv} 级！` : `${STAFF[s.id].name}学了不少本事（经验 +30）`, 'good');

    if (G.money < price || s.gifted === G.day) return;
    G.money -= price; s.gifted = G.day;

    const kind = d.love === gid ? 'love' : d.like === gid ? 'like' : 'meh';
    s.known = s.known || {}; s.known[gid] = kind;
    const before = s.aff;
    const add = kind === 'love' ? 15 : kind === 'like' ? 8 : 3;
    s.aff = Math.min(100, s.aff + add); s.mood = Math.min(100, s.mood + add);
    Sound.play(kind === 'love' ? 'happy' : 'pop');

    s.chatted = G.day;

        logEvent(`和${STAFF[s.id].name}的交情更深了`);
      }
    }
  },
};

/* ---------- 每日目标 ---------- */
function genDaily() {
  const last = G.hist[G.hist.length - 1];
  const opts = [];
  const sv = last ? last.served : 14;
  opts.push({ k: 'served', n: Math.max(10, Math.round(sv * 1.1 / 2) * 2) });
  const inc = last ? last.food : 110;
  opts.push({ k: 'income', n: Math.max(100, Math.round(inc * 1.12 / 10) * 10) });
  if (G.day > 2) opts.push({ k: 'great', n: Math.max(3, Math.round((last ? last.great : 3) * 1.15) + 1) });
  if (G.day > 3) opts.push({ k: 'nobad', n: 0 });
  const sellable = G.menu.filter(id => DISH[id].price >= 8);
  if (sellable.length && G.day > 1) { const dish = pick(sellable); opts.push({ k: 'sell', dish, n: 4 + G.star * 2 }); }
  const g = pick(opts);
  g.reward = 30 + G.star * 25 + (g.k === 'nobad' ? 30 : 0);
  return g;
}

/* ---------- 任务 ---------- */
function checkQuests() {
  if (!G || G.demo) return;
  let guard = 0;
  while (G.quest < QUESTS.length && QUESTS[G.quest].check(G) && guard++ < 20) {
    const q = QUESTS[G.quest];
    G.money += q.money; G.quest++;
    toast(`任务完成「${q.name}」！奖励 ${q.money} 文`, 'good');
    Sound.play('fanfare');
    logEvent(`完成「${q.name}」`);
  }
}

/* ================= 启动与主循环 ================= */
let lastSaved = null;
function audioKick() {
  if (Sound.init()) { Sound.resume(); if (Sound.musicOn) Sound.startMusic(); }
}
function endDay() {
  if (!W || W.phase === 'night' || G.demo) return;
  W.phase = 'night';
  W.agents.forEach(a => { releaseTask(a); a.cook = null; a.target = null; a.fight = 0; a.performing = false; a.path = []; a.x = a.home.x; a.y = a.home.y; a.act = null; a.pose = 'stand'; });
  W.coins.forEach(c => collectCoin(c, true)); W.coins = [];
  W.parties = []; W.tickets = []; W.pass = []; W.queue = []; W.fx = W.fx.filter(f => f.k === 'paper');
  W.tables.forEach(t => { t.party = null; t.claim = null; });
  UI.onPhase();
  const rep = Flow.settle();
  UI.hud();
  setTimeout(() => Flow.showSummary(rep), 700);
}

function drawTitleOverlay(ctx) {
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, 'rgba(20,10,4,.1)'); g.addColorStop(0.55, 'rgba(20,10,4,0)'); g.addColorStop(1, 'rgba(20,10,4,.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `86px ${FONT_D}`;
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,248,230,.9)'; ctx.strokeText('云来客栈', 470, y + 66);
  ctx.fillStyle = '#2a1408'; ctx.fillText('云来客栈', 470, y + 66);
  ctx.save(); ctx.translate(648, y + 44); ctx.rotate(0.08);
  rr(ctx, -20, -30, 40, 60, 4); ctx.fillStyle = '#c0392b'; ctx.fill();
  ctx.fillStyle = '#fbe8c0'; ctx.font = `18px ${FONT_D}`; ctx.fillText('掌', 0, -14); ctx.fillText('柜', 0, 6); ctx.font = `11px ${FONT_D}`; ctx.fillText('之印', 0, 22);
  ctx.restore();

}

function toLogical(e) { const r = R.cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; }
function hitAt(p, pad) {
  for (let i = R.hits.length - 1; i >= 0; i--) { const q = R.hits[i]; if (p.x >= q.x - pad && p.x <= q.x + q.w + pad && p.y >= q.y - pad && p.y <= q.y + q.h + pad) return q; }
  return null;
}
function bindInput() {
  R.cv.addEventListener('pointerdown', e => {
    audioKick();
    if (Dlg.open) { Dlg.click(); return; }
    if (!G || G.demo || UI.modalOpen) return;
    const p = toLogical(e);
    const q = hitAt(p, 0) || hitAt(p, e.pointerType === 'touch' ? 14 : 4);
    if (q) { q.fn(); UI.hud(); }
  });
  R.cv.addEventListener('pointermove', e => {
    if (!G || G.demo || e.pointerType === 'touch') { R.hover = null; return; }
    const q = hitAt(toLogical(e), 2);
    R.hover = q; R.cv.style.cursor = q ? 'pointer' : 'default';
  });
  R.cv.addEventListener('pointerleave', () => { R.hover = null; });
}

let hudT = 0, tipT = 0, questT = 0, lastFrame = performance.now();
let lastTipAt = 0;
function scanTips() {
  if (!G || G.demo || W.phase !== 'business') return;
  if (performance.now() - lastTipAt < 5500) return;
  const n0 = Object.keys(G.seenTips).length;
  const tipOnce = (k, t) => { if (Object.keys(G.seenTips).length !== n0 || G.seenTips[k]) return; G.seenTips[k] = 1; toast(t); lastTipAt = performance.now(); };
  if (W.parties.some(p => p.state === 'order')) tipOnce('order', '客人要点菜了！跑堂会去招呼；也可以点一下「点菜」气泡亲自招呼。');
  if (W.pass.length) tipOnce('pass', '菜做好了，摆在后厨出菜台上。点一下菜碟可以亲自端过去。');
  if (W.coins.length) tipOnce('coin', '客人吃完留下铜钱，点一下就收进柜台（不点也会自动收）。');
  if (W.tables.some(t => t.dirty && !t.party)) tipOnce('dirty', '桌子脏了，擦干净才能接下一桌。忙不过来就点一下亲自擦。');
  if (W.parties.some(p => p.state === 'sneak' && p.members[0].x > 130)) tipOnce('thief', '有个蒙面人鬼鬼祟祟摸向柜台——快点他！');
  if (W.parties.some(p => p.state === 'trouble')) tipOnce('thug', '地痞闹事！连点他六下就能赶出去，请个护院更省心。');
  if (W.parties.some(p => p.state === 'dash' && !p.dashDone)) tipOnce('dash', '有人吃霸王餐想溜！赶紧点他！');
  if (W.queue.length >= 2) tipOnce('queue', '门外排起队了！点客人头上的茶碗先上碗茶，他们能多等一会儿。');
}
function frame(now) {
  const rdt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  try {
    if (W && G) {
      const paused = UI.modalOpen || Dlg.open;
      const sp = G.demo ? 1 : UI.speed;
      if (!paused && sp > 0) { for (let i = 0; i < sp; i++) updateWorld(rdt); if (G.demo && W.t > HOUR_SEC * 13.3) W.t = HOUR_SEC * 10.4; }
      Dlg.tick(rdt);
      render(rdt);
      hudT += rdt; tipT += rdt; questT += rdt;
      if (hudT > 0.25) { hudT = 0; UI.hud(); }
      if (tipT > 0.5) { tipT = 0; scanTips(); }
      if (questT > 1) { questT = 0; checkQuests(); }
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

function boot(data) {
  R.cv = $('#cv'); R.ctx = R.cv.getContext('2d');
  UI.init();
  bindInput();
  window.addEventListener('resize', () => { R.key = ''; });
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { R.key = ''; _iconCache.clear(); UI.init(); });
  const start = () => {
    if (data && data.save && data.save.v) { G = data.save; newWorld(); UI.showGame(true); if (!G.daily) G.daily = genDaily(); Flow.applyMorningState(); UI.onPhase(); }
    else Flow.toTitle();
    requestAnimationFrame(frame);
  };
  let started = false; const go = () => { if (!started) { started = true; start(); } };
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load(`40px "Ma Shan Zheng"`, FONT_SAMPLE_D), document.fonts.load(`14px "ZCOOL KuaiLe"`, FONT_SAMPLE_U)]).then(go, go);
      setTimeout(go, 2200);
    } else go();
  } catch (e) { go(); }
}
const FONT_SAMPLE_D = '江湖客栈经营记掌柜之印云来客栈后厨说书台福酒柜待修天地玄黄宇宙天下第一' + DISHES.map(d => d.name).join('');
const FONT_SAMPLE_U = '开张咯打烊赞不绝口好再来妙极了名不虚传满意不错好吃还行凑合一般般差评什么破店再也不来了名气文闹事掌柜亲自招呼加把火住店溜了吃霸王餐抓到小毛贼打跑地痞0123456789+-';

(function () {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ save: lastSaved })); } catch (e) { /* ignore */ } }
  const run = d => boot(d || {});
  if (hot && typeof hot.ready === 'function') { try { hot.ready(run); } catch (e) { run((hot && hot.data) || {}); } }
  else run((hot && hot.data) || {});
})();
